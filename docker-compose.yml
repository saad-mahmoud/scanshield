services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scanshield}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  backend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-scanshield}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-scanshield}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate &&
      pnpm install && pnpm --filter backend dev"

  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: >
      sh -c "corepack enable && corepack prepare pnpm@9.15.4 --activate &&
      pnpm install && pnpm --filter frontend dev"

networks:
  default:
    name: scanshield

volumes:
  postgres_data:
